# Mosquitto 2.x mặc định chỉ nhận kết nối từ chính Pi. File này mở cổng 1883 cho ESP8266 trong mạng nhà.
# sudo cp deploy/mosquitto-irhub.conf /etc/mosquitto/conf.d/ && sudo systemctl restart mosquitto

listener 1883 0.0.0.0
allow_anonymous true

# Nên bật mật khẩu khi đã chạy ổn:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd irhub
# rồi đổi hai dòng trên thành:
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
# và đặt MQTT_USER / MQTT_PASS trong backend/.env, cùng tài khoản trong firmware ESP8266.
