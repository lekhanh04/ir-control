# Mosquitto 2.x mặc định chỉ nhận kết nối từ chính Pi. File này mở cổng 1883 cho ESP8266 trong mạng nhà
# và BẮT BUỘC đăng nhập, để thiết bị lạ trong mạng không gửi lệnh IR hay giả làm bộ phát được.
#
# 1. Tạo tài khoản (hỏi mật khẩu):
#      sudo mosquitto_passwd -c /etc/mosquitto/passwd irhub
#      sudo chown mosquitto: /etc/mosquitto/passwd && sudo chmod 600 /etc/mosquitto/passwd
# 2. Cài file này:
#      sudo cp deploy/mosquitto-irhub.conf /etc/mosquitto/conf.d/ && sudo systemctl restart mosquitto
# 3. Đặt MQTT_USER=irhub, MQTT_PASS=<mật khẩu> trong backend/.env, và cùng tài khoản trong firmware ESP8266,
#    module giọng nói (và tools/fake_esp.py --user irhub --password ...).
#
# Chỉ để thử nhanh khi chưa có mật khẩu: đổi hai dòng cuối thành "allow_anonymous true".

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
